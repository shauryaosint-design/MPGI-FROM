<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPGI Treasure Hunt | Ready for the Treasure Hunt?</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wooden-bg">
    <!-- Decorative elements -->
    <img src="images/pirate-flag.png" alt="Pirate Flag" class="deco pirate-flag">
    <img src="images/compass.png" alt="Compass" class="deco compass">
    <img src="images/magnifying-glass.png" alt="Magnifying Glass" class="deco magnifier">
    <img src="images/rope.png" alt="Rope" class="deco rope">

    <div class="main-card">
      <h1 class="title">
        <span class="ready">READY FOR THE</span><br>
        <span class="treasure">TREASURE</span><br>
        <span class="hunt">HUNT?</span>
      </h1>

      <div class="content-area">
        <!-- Map section -->
        <div class="map-container">
          <div class="map">
            <img src="images/treasure-map.jpg" alt="Treasure Map" class="map-image">
          </div>
        </div>

        <!-- Buttons / Clues -->
        <div class="clues">
          <a href="register.html" class="clue-btn clue1">
            <div class="clue-number">REGISTER NOW</div>
            <div class="clue-text">Solo ₹70 • Team ₹70×members</div>
            <div class="clue-icon">🏴‍☠️</div>
          </a>

          <a href="prizes.html" class="clue-btn clue2">
            <div class="clue-number">PRIZES</div>
            <div class="clue-text">Official Certificate + ₹1100 Cash</div>
            <div class="clue-icon">🏆</div>
          </a>

          <a href="tel:983883998" class="clue-btn clue3">
            <div class="clue-number">CONTACT US</div>
            <div class="clue-text">Tap to call 983883998</div>
            <div class="clue-icon">📞</div>
          </a>
        </div>
      </div>

      <div class="banner">
        FOLLOW THE CLUES. FIND THE TREASURE! ✕
      </div>
    </div>

    <footer class="footer">
      <p>MPGI College Treasure Hunt Competition 2026</p>
    </footer>
  </div>
</body>
</html>
